family: decision
condition: few-shot
source: Barbosa et al. 2025, Figure 3, Animal Products
instructions: You are labeling tool to create labels for a classification task. I will provide text data from an advertisement of a product.
criteria:
  relevant: if the product is an animal or is made from animal
  not relevant: if the product is 100% synthetic with no animal involved.
examples:
  - text: Great White Shark Embroidered Patch Iron on Patch For Clothes
    label: not relevant
    explanation: The product is a piece of clothes with an animal embroidered.
  - text: Kennel club registered Labrador puppies For Sale in Launceston, Cornwall
    label: relevant
    explanation: The product on example 2 are selling live dog puppies. 100% animal product in this case.
  - text: Swimbait for Bass Trout Redfish Walleye Saltwater And Freshwater.
    label: not relevant
    explanation: In example 3 we have a swimbait to catch fish. Probably made of plastic.
  - text: Mario Buccellati, a Rare and Exceptional Italian Silver Goat For Sale
    label: not relevant
    explanation: This example 4 is also not an animal product. The gator in the ad is made out of silver.
  - text: '5. Advertisement: 1/10X Wholesale High Quality Natural Ostrich Feathers Wedding Party 15-30c BIBI | eBay'
    label: relevant
    explanation: This is a product made out of Ostrich Feathers. Ostrich is an animal, being that an animal by-product.
