[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-screening"
version = "0.1.0"
description = "Evaluate wildlife advert screeners and rebuild the recorded study report"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "matplotlib>=3.8,<4", "plotly>=6,<7", "Markdown>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "scikit-learn>=1.4,<2", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
wildlife-screen = "wildlife_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "site", "tests"]
testpaths = ["tests"]
# Ignore unrelated local editor copies, which are not maintained test modules.
addopts = ["--ignore-glob=* 2.py"]

[tool.ruff]
extend-exclude = ["* 2.py"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
# JSON/API envelopes intentionally allow Any at provider boundaries.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Descriptive test names make repetitive test docstrings unnecessary.
"tests/**" = ["D"]

[tool.mypy]
mypy_path = ["src", "site", "tests"]
python_version = "3.11"
strict = true
exclude = ['(^|/)[^/]+ 2\.py$']

# sklearn supplies reference metrics in tests but does not ship typing metadata.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly.*", "markdown.*"]
ignore_missing_imports = true
